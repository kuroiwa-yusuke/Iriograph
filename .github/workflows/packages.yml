name: Iriograph Packages

on:
  push:
    branches:
      - main
    tags:
      - "packages-v*"
    paths:
      - ".github/package-release-version"
      - ".github/workflows/packages.yml"
      - "scripts/package-release.mjs"
      - "scripts/publish-packages.mjs"
      - "scripts/write-package-publish-audit.sh"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to npmjs with Trusted Publishing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

# A package version is immutable once published. Serialize ref-based retries
# so two valid release triggers cannot race while checking and publishing it.
concurrency:
  group: iriograph-packages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      failedStage: ${{ steps.failure_summary.outputs.failedStage }}
      failureTailBase64: ${{ steps.failure_summary.outputs.failureTailBase64 }}
    steps:
      - id: verify_checkout
        uses: actions/checkout@v4
      - id: verify_setup
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install workspace dependencies
        id: verify_install
        run: npm ci
      - name: Verify requested package version
        id: verify_version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/packages-v* ]]; then
            expected_version="${GITHUB_REF_NAME#packages-v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            expected_version="$(<.github/package-release-version)"
          else
            echo "Unsupported package release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package release version: ${expected_version}" >&2
            exit 1
          fi
          EXPECTED_PACKAGE_VERSION="${expected_version}" npm run verify:package-versions
      - name: Build packages for workspace tests
        id: verify_test_build
        shell: bash
        run: |
          set -o pipefail
          npm run build:packages 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Test mock workspace
        id: verify_test_mock
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @iriograph/mock 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Test core workspace
        id: verify_test_core
        shell: bash
        env:
          # Temporary shared-runner allowance. The normal product/verify gate
          # keeps the fixed 300 ms budget.
          IRIOGRAPH_SMALL_INITIAL_PIPELINE_BUDGET_MS: "400"
        run: |
          set -o pipefail
          # Core contains fixed wall-clock performance gates. Run files in one
          # worker so shared-runner test-file contention is not measured as
          # product latency; the budgets themselves remain absolute.
          npm run test --workspace @iriograph/core -- --maxWorkers=1 --no-file-parallelism 2>&1 \
            | tee /tmp/iriograph-workspace-verify.log
      - name: Test ELK workspace
        id: verify_test_layout_elk
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @iriograph/layout-elk 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Test semantic access workspace
        id: verify_test_semantic_access
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @iriograph/semantic-access 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Test extension package workspaces
        id: verify_test_extensions
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @iriograph/rdf-io \
            --workspace @iriograph/profile-resolver \
            --workspace @iriograph/profile-kit \
            --workspace @iriograph/presentation-tools \
            --workspace @iriograph/host-conformance \
            --workspace @iriograph/agent-bridge 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Test Vue editor workspace
        id: verify_test_vue_editor
        shell: bash
        run: |
          set -o pipefail
          npm run test --workspace @iriograph/vue-editor 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Typecheck workspaces
        id: verify_typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Build workspaces
        id: verify_build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Verify packed package consumer
        id: verify_package_consumer
        shell: bash
        run: |
          set -o pipefail
          npm run verify:package-consumer 2>&1 | tee /tmp/iriograph-workspace-verify.log
      - name: Summarize failed stage
        id: failure_summary
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.verify_checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.verify_setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.verify_install.outcome }}
          VERSION_OUTCOME: ${{ steps.verify_version.outcome }}
          TEST_BUILD_OUTCOME: ${{ steps.verify_test_build.outcome }}
          TEST_MOCK_OUTCOME: ${{ steps.verify_test_mock.outcome }}
          TEST_CORE_OUTCOME: ${{ steps.verify_test_core.outcome }}
          TEST_LAYOUT_ELK_OUTCOME: ${{ steps.verify_test_layout_elk.outcome }}
          TEST_SEMANTIC_ACCESS_OUTCOME: ${{ steps.verify_test_semantic_access.outcome }}
          TEST_EXTENSIONS_OUTCOME: ${{ steps.verify_test_extensions.outcome }}
          TEST_VUE_EDITOR_OUTCOME: ${{ steps.verify_test_vue_editor.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.verify_typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.verify_build.outcome }}
          PACKAGE_CONSUMER_OUTCOME: ${{ steps.verify_package_consumer.outcome }}
        run: |
          set -euo pipefail
          failed_stage="none"
          record_failure() {
            if [[ "${failed_stage}" == "none" && ( "$2" == "failure" || "$2" == "cancelled" ) ]]; then
              failed_stage="$1"
            fi
          }
          record_failure "install" "${CHECKOUT_OUTCOME}"
          record_failure "install" "${SETUP_OUTCOME}"
          record_failure "install" "${INSTALL_OUTCOME}"
          record_failure "version-check" "${VERSION_OUTCOME}"
          record_failure "test-build" "${TEST_BUILD_OUTCOME}"
          record_failure "test-mock" "${TEST_MOCK_OUTCOME}"
          record_failure "test-core" "${TEST_CORE_OUTCOME}"
          record_failure "test-layout-elk" "${TEST_LAYOUT_ELK_OUTCOME}"
          record_failure "test-semantic-access" "${TEST_SEMANTIC_ACCESS_OUTCOME}"
          record_failure "test-extensions" "${TEST_EXTENSIONS_OUTCOME}"
          record_failure "test-vue-editor" "${TEST_VUE_EDITOR_OUTCOME}"
          record_failure "typecheck" "${TYPECHECK_OUTCOME}"
          record_failure "build" "${BUILD_OUTCOME}"
          record_failure "package-consumer" "${PACKAGE_CONSUMER_OUTCOME}"
          echo "failedStage=${failed_stage}" >> "${GITHUB_OUTPUT}"
          failure_tail_base64=""
          if [[ "${failed_stage}" != "none" && -f /tmp/iriograph-workspace-verify.log ]]; then
            failure_tail_base64="$(tail -c 1200 /tmp/iriograph-workspace-verify.log \
              | sed -E $'s/\\x1b\\[[0-?]*[ -\\/]*[@-~]//g' \
              | sed -E '/token|password|secret|credential|authorization|_authToken|private[_-]?key/I c\[REDACTED-SENSITIVE-LINE]' \
              | base64 -w0)"
          fi
          echo "failureTailBase64=${failure_tail_base64}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/packages-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    runs-on: ubuntu-latest
    outputs:
      failedStage: ${{ steps.failure_summary.outputs.failedStage }}
      failureTailBase64: ${{ steps.failure_summary.outputs.failureTailBase64 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - id: publish_checkout
        uses: actions/checkout@v4
      - id: publish_setup
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install workspace dependencies
        id: publish_install
        run: npm ci
      - name: Verify requested package version
        id: publish_version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/packages-v* ]]; then
            expected_version="${GITHUB_REF_NAME#packages-v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            expected_version="$(<.github/package-release-version)"
          else
            echo "Unsupported package release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package release version: ${expected_version}" >&2
            exit 1
          fi
          EXPECTED_PACKAGE_VERSION="${expected_version}" npm run verify:package-versions
      - name: Verify npm CLI supports Trusted Publishing
        id: publish_npm_cli
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node --input-type=module -e '
            const [major, minor, patch] = process.argv[1].split(/[.-]/u, 3).map(Number);
            if (![major, minor, patch].every(Number.isInteger)
              || major < 11
              || (major === 11 && minor < 5)
              || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error(`npm ${process.argv[1]} does not support Trusted Publishing; require >=11.5.1`);
            }
          ' "${npm_version}"
      - name: Lock publishing to npmjs OIDC
        id: publish_npm_registry
        shell: bash
        env:
          EXPECTED_NPM_REGISTRY: "https://registry.npmjs.org/"
        run: |
          set -euo pipefail
          if [[ -n "${NODE_AUTH_TOKEN:-}" || -n "${NPM_TOKEN:-}" ]]; then
            echo "Long-lived npm publish tokens are forbidden; use GitHub OIDC" >&2
            exit 1
          fi
          publish_userconfig="${RUNNER_TEMP}/iriograph-publish.npmrc"
          npm config set registry="${EXPECTED_NPM_REGISTRY}" --userconfig="${publish_userconfig}"
          npm config set '@iriograph:registry'="${EXPECTED_NPM_REGISTRY}" --userconfig="${publish_userconfig}"
          configured_registry="$(npm config get registry --userconfig="${publish_userconfig}")"
          if [[ "${configured_registry}" != "${EXPECTED_NPM_REGISTRY}" ]]; then
            echo "npm registry must be exactly ${EXPECTED_NPM_REGISTRY}" >&2
            exit 1
          fi
          scoped_registry="$(npm config get '@iriograph:registry' --userconfig="${publish_userconfig}")"
          if [[ "${scoped_registry}" != "${EXPECTED_NPM_REGISTRY}" ]]; then
            echo "@iriograph scope must be exactly ${EXPECTED_NPM_REGISTRY}" >&2
            exit 1
          fi
          if grep -Eq '_authToken|_password|username' "${publish_userconfig}"; then
            echo "The publish npm configuration must not contain registry credentials" >&2
            exit 1
          fi
          echo "NPM_CONFIG_USERCONFIG=${publish_userconfig}" >> "${GITHUB_ENV}"
      - name: Publish packages
        id: publish_packages
        shell: bash
        run: |
          set -o pipefail
          npm run publish:packages 2>&1 | tee /tmp/iriograph-package-publish.log
      - name: Summarize failed stage
        id: failure_summary
        if: ${{ always() }}
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.publish_checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.publish_setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.publish_install.outcome }}
          VERSION_OUTCOME: ${{ steps.publish_version.outcome }}
          NPM_CLI_OUTCOME: ${{ steps.publish_npm_cli.outcome }}
          NPM_REGISTRY_OUTCOME: ${{ steps.publish_npm_registry.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_packages.outcome }}
        run: |
          set -euo pipefail
          failed_stage="none"
          record_failure() {
            if [[ "${failed_stage}" == "none" && ( "$2" == "failure" || "$2" == "cancelled" ) ]]; then
              failed_stage="$1"
            fi
          }
          record_failure "install" "${CHECKOUT_OUTCOME}"
          record_failure "install" "${SETUP_OUTCOME}"
          record_failure "install" "${INSTALL_OUTCOME}"
          record_failure "version-check" "${VERSION_OUTCOME}"
          record_failure "npm-cli" "${NPM_CLI_OUTCOME}"
          record_failure "npm-registry" "${NPM_REGISTRY_OUTCOME}"
          record_failure "npm-publish" "${PUBLISH_OUTCOME}"
          echo "failedStage=${failed_stage}" >> "${GITHUB_OUTPUT}"
          failure_tail_base64=""
          if [[ "${failed_stage}" != "none" && -f /tmp/iriograph-package-publish.log ]]; then
            failure_tail_base64="$(tail -c 1800 /tmp/iriograph-package-publish.log \
              | sed -E $'s/\\x1b\\[[0-?]*[ -\\/]*[@-~]//g' \
              | sed -E '/token|password|secret|credential|authorization|_authToken|private[_-]?key/I c\[REDACTED-SENSITIVE-LINE]' \
              | base64 -w0)"
          fi
          echo "failureTailBase64=${failure_tail_base64}" >> "${GITHUB_OUTPUT}"

  audit:
    needs: [verify, publish]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/packages-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable package publish diagnostic
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_FAILED_STAGE: ${{ needs.verify.outputs.failedStage || 'none' }}
          PUBLISH_FAILED_STAGE: ${{ needs.publish.outputs.failedStage || 'none' }}
          VERIFY_LOG_TAIL_BASE64: ${{ needs.verify.outputs.failureTailBase64 || '' }}
          PUBLISH_LOG_TAIL_BASE64: ${{ needs.publish.outputs.failureTailBase64 || '' }}
        run: |
          set -euo pipefail
          package_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('packages/core/package.json', 'utf8')).version)")"
          TARGET_COMMIT="${GITHUB_SHA}" \
          PACKAGE_VERSION="${package_version}" \
          VERIFY_RESULT="${VERIFY_RESULT}" \
          PUBLISH_RESULT="${PUBLISH_RESULT}" \
          VERIFY_FAILED_STAGE="${VERIFY_FAILED_STAGE}" \
          PUBLISH_FAILED_STAGE="${PUBLISH_FAILED_STAGE}" \
          VERIFY_LOG_TAIL_BASE64="${VERIFY_LOG_TAIL_BASE64}" \
          PUBLISH_LOG_TAIL_BASE64="${PUBLISH_LOG_TAIL_BASE64}" \
          bash scripts/write-package-publish-audit.sh
