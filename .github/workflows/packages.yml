name: Iriograph Packages

on:
  push:
    branches:
      - main
    tags:
      - "packages-v*"
    paths:
      - ".github/package-release-version"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to AWS CodeArtifact"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::571179238578:role/KuroxiomPackagesPublishRole
  CODEARTIFACT_DOMAIN: kuroxiom
  CODEARTIFACT_DOMAIN_OWNER: "571179238578"
  CODEARTIFACT_REPOSITORY: kuroxiom-packages

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify requested package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/packages-v* ]]; then
            expected_version="${GITHUB_REF_NAME#packages-v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            expected_version="$(<.github/package-release-version)"
          else
            echo "Unsupported package release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package release version: ${expected_version}" >&2
            exit 1
          fi
          EXPECTED_PACKAGE_VERSION="${expected_version}" npm run verify:package-versions
      - run: npm run verify

  publish:
    needs: verify
    if: >-
      startsWith(github.ref, 'refs/tags/packages-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify requested package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/packages-v* ]]; then
            expected_version="${GITHUB_REF_NAME#packages-v}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            expected_version="$(<.github/package-release-version)"
          else
            echo "Unsupported package release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ ! "${expected_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package release version: ${expected_version}" >&2
            exit 1
          fi
          EXPECTED_PACKAGE_VERSION="${expected_version}" npm run verify:package-versions
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to CodeArtifact
        run: >-
          aws codeartifact login
          --tool npm
          --domain "${CODEARTIFACT_DOMAIN}"
          --domain-owner "${CODEARTIFACT_DOMAIN_OWNER}"
          --repository "${CODEARTIFACT_REPOSITORY}"
          --region "${AWS_REGION}"
      - name: Configure @iriograph scope registry
        shell: bash
        run: |
          codeartifact_registry="$(npm config get registry)"
          case "${codeartifact_registry}" in
            https://*.d.codeartifact.*.amazonaws.com/npm/*/) ;;
            *)
              echo "CodeArtifact npm registry was not configured" >&2
              exit 1
              ;;
          esac
          npm config set "@iriograph:registry" "${codeartifact_registry}"
      - run: npm run publish:packages
      - name: Mark published package version
        shell: bash
        run: |
          set -euo pipefail

          published_version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('packages/core/package.json', 'utf8')).version)")"
          if [[ ! "${published_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid published package version" >&2
            exit 1
          fi

          published_tag="packages-published-v${published_version}"
          target_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          verify_remote_tag() {
            git fetch --no-tags origin "refs/tags/${published_tag}"
            remote_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [[ "${remote_commit}" == "${target_commit}" ]]; then
              echo "${published_tag} already marks the published commit"
              return 0
            fi
            echo "${published_tag} already marks a different commit" >&2
            return 1
          }

          if git ls-remote --exit-code --refs origin "refs/tags/${published_tag}" >/dev/null 2>&1; then
            verify_remote_tag
            exit 0
          fi

          git tag "${published_tag}" "${target_commit}"
          if git push origin "refs/tags/${published_tag}"; then
            exit 0
          fi

          # A concurrent successful release may have created the same immutable tag.
          verify_remote_tag
